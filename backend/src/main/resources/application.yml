server:
  port: ${PORT:8080}

app:
  cors:
    frontend-url: ${FRONTEND_URL:http://localhost:5173}

spring:
  application:
    name: passu-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:cartly}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:${DB_USER:root}}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

passu:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    access-token-expiration-ms: 86400000
    refresh-token-expiration-ms: 604800000
  admin:
    email: ${PASSU_ADMIN_EMAIL:${CARTLY_ADMIN_EMAIL:admin@passu.com}}
    password: ${PASSU_ADMIN_PASSWORD:${CARTLY_ADMIN_PASSWORD:Admin@Passu2025!}}
    full-name: Platform Administrator

cartly:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    access-token-expiration-ms: 86400000
    refresh-token-expiration-ms: 604800000
  admin:
    email: ${PASSU_ADMIN_EMAIL:${CARTLY_ADMIN_EMAIL:admin@passu.com}}
    password: ${PASSU_ADMIN_PASSWORD:${CARTLY_ADMIN_PASSWORD:Admin@Passu2025!}}
    full-name: Platform Administrator

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
